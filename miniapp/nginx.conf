server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Default: reach the published API via the Docker host gateway.
    # Some sandboxed / mixed-iptables hosts filter container-to-container TCP
    # to http://api:3000 even though the API is healthy on :3000 from the host.
    # Compose sets extra_hosts host.docker.internal=host-gateway on `web`.
    # Alternative on a normal bridge (ICC works): proxy_pass http://api:3000;
    location /api/ {
        client_max_body_size 16m;
        proxy_pass http://host.docker.internal:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
